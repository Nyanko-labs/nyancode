name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning cli/nyan install.sh workflows/*.sh
      - name: nvim plugin loads
        run: |
          sudo apt-get install -y -qq neovim >/dev/null
          nvim --clean --headless -c "luafile core/nvim/nyancode.lua" -c "qa"
      - name: opencode command frontmatter
        run: |
          for f in core/ai/commands/nyan-*.md; do
            head -1 "$f" | grep -q '^---$' || { echo "missing frontmatter: $f"; exit 1; }
            grep -q '^description:' "$f" || { echo "missing description: $f"; exit 1; }
          done
